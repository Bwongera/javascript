
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palindrome Checker</title>

    <link rel="stylesheet" href="./learnpolindrome.css">
</head>
<body>

<div class="form-container">
    <form id="palindrome-checker">

        <h2 class="form-title">P̶O̶L̶I̶N̶D̶R̶O̶M̶E̶ ̶C̶H̶E̶C̶K̶E̶R̶</h2>

        <input
            type="text"
            id="text-input"
            placeholder="Enter a word or sentence">

        <button
            class="form-button"
            type="button"
            id="check-btn">
            Check
        </button>

        <span id="result">Not checked yet!!</span>

    </form>
</div>

 <script src="./learnpolindrome.js"></script> 
</body>
</html>
