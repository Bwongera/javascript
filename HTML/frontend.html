<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Frontend</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;

            display: flex;
            justify-content: center;
            align-items: center;

            height: 100vh;
        }

        .card {
            width: 320px;
            padding: 35px;
            text-align: center;

            border-radius: 20px;

            background: linear-gradient(135deg,
                    red,
                    blue,
                    green);

            color: white;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .card h1 {
            margin-bottom: 15px;
        }

        .card p {
            margin-bottom: 25px;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;

            border: none;
            border-radius: 8px;

            background: white;
            color: #222;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.05);
        }
    </style>
</head>

<body>

    <div class="card">

        <h1>John Ngabo</h1>

        <p id="message">
            Frontend Developer
        </p>

        <button onclick="changeText()">
            Click Me
        </button>

    </div>


    <script>

        function changeText() {

            document.getElementById("message").textContent =
                "I am learning JavaScript 🚀";

        }

    </script>

</body>

</html>
