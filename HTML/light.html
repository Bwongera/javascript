<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Light Bulb ON OFF</title>

  <link rel="stylesheet" href="../css/light.css">
</head>

<body>

  <div class="container">

    <h1>Light Bulb Project</h1>

    <p>Click the buttons to turn the light ON or OFF.</p>

    <div class="bulb-container">


      <img id="on-image"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRozyJ6Ovf0GA4CrdVZpMDzZ4dKLF9W4O9u_FVm9Cexyj1IBa-AlJY5HfWW&s=10"
        alt="Light bulb ON" hidden>


      <img id="off-image"
        src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS21nUHrDTBwXn7x-uQBaW8qDuoy9oIP9zJzWQK-d9cVw&s=10"
        alt="Light bulb OFF">

    </div>

    <div class="buttons">

      <button class="on" id="on-button">
        ON
      </button>

      <button class="off" id="off-button">
        OFF
      </button>

    </div>

    <h2 id="status">Light is OFF</h2>

  </div>

  <script src="../JS/light.js"></script>

</body>

</html>
