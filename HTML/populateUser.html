<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Table</title>
    <link rel="stylesheet" href="../css/populateUser.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <header>
        <div class="title">
            <h1>User Directory</h1>
            <h2>August 19 2026</h2>
        </div>

        <div class="search">
            <i class="fa-solid fa-magnifying-glass" style="color: rgb(128, 128, 128);"></i>
            <input type="text" placeholder="Search User...">
        </div>
    </header>
    <main>

        <table>

            <thead>
                <tr>
                    <th>Index</th>
                    <th>First Name</th>
                    <th>Last Name</th>
                    <th>Email</th>
                    <th>UserName</th>
                    <th>Address</th>
                    <th colspan="2">Action</th>
                </tr>
            </thead>
              <!--  -->
            <tbody>
              
            </tbody>
        </table>
    </main>
    <script src="../JS/populateUser.js"></script>
</body>

</html>
