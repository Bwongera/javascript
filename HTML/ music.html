<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VibeVault - Music Player</title>
    <link rel="stylesheet" href="../css/music.css">
</head>

<body>

    <div class="app">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="logo">
                <div class="logo-icon">♪</div>

                <div>
                    <h1>VibeVault</h1>
                    <span>Music Player</span>
                </div>
            </div>

            <nav>
                <button class="nav-btn active" id="libraryBtn">
                    <span>⌂</span>
                    Library
                </button>

                <button class="nav-btn" id="favoriteBtn">
                    <span>♡</span>
                    Favorites
                </button>
            </nav>

            <div class="sidebar-bottom">
                <p>Your music. Your vibe.</p>
                <small>
                    Add your favorite songs and enjoy your music.
                </small>
            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main">

            <!-- HEADER -->
            <header class="header">

                <div>
                    <small class="label">YOUR LIBRARY</small>
                    <h2 id="pageTitle">My Music</h2>
                </div>

                <label for="musicInput" class="add-btn">
                    <span>＋</span>
                    Add Music
                </label>

                <input type="file" id="musicInput" accept="audio/*" multiple hidden>

            </header>


            <!-- NOW PLAYING -->
            <section class="player-card">

                <div class="cover" id="cover">
                    ♪
                </div>

                <div class="player-info">

                    <small class="now-playing">
                        NOW PLAYING
                    </small>

                    <h3 id="songTitle">
                        No Song Selected
                    </h3>

                    <p id="artist">
                        Add music to start listening
                    </p>


                    <!-- PROGRESS -->
                    <div class="progress-container">

                        <div class="progress-bar" id="progressBar">
                            <div class="progress" id="progress"></div>
                        </div>

                        <div class="time">
                            <span id="currentTime">0:00</span>
                            <span id="duration">0:00</span>
                        </div>

                    </div>


                    <!-- CONTROLS -->
                    <div class="controls">

                        <button id="previousBtn" class="control" title="Previous">
                            ⏮
                        </button>

                        <button id="playBtn" class="play" title="Play">
                            ▶
                        </button>

                        <button id="nextBtn" class="control" title="Next">
                            ⏭
                        </button>

                    </div>

                </div>

            </section>


            <!-- PLAYLIST -->
            <section class="playlist-section">

                <div class="playlist-header">

                    <div>
                        <h3 id="playlistTitle">
                            Your Songs
                        </h3>

                        <span id="songCount">
                            0 songs
                        </span>
                    </div>


                    <div class="volume">

                        <span>🔊</span>

                        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.8">

                    </div>

                </div>


                <!-- SONGS -->
                <div class="songs" id="songs"></div>


                <!-- EMPTY STATE -->
                <div class="empty" id="empty">

                    <div class="empty-icon">
                        🎵
                    </div>

                    <h4>
                        Your playlist is empty
                    </h4>

                    <p>
                        Click <strong>Add Music</strong>
                        to choose songs from your computer.
                    </p>

                </div>

            </section>

        </main>

    </div>


    <!-- AUDIO -->
    <audio id="audio"></audio>

    <script src="../JS/music.js"></script>

</body>

</html>
